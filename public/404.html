<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Minimal GitHub Pages SPA fallback: remember the deep link, then jump to the repo root.
    sessionStorage.redirect = location.href;
    const parts = location.pathname.split('/').filter(Boolean);
    const repoBase = location.hostname.endsWith('github.io') && parts.length ? `/${parts[0]}/` : '/';
    window.location.replace(repoBase);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
