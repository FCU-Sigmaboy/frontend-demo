# =============================================================================
# 基礎 CI Workflow
# =============================================================================
# 此 workflow 在每次 push 和 pull request 時執行，確保程式碼品質和建置正確性
#
# 功能：
#   - 安裝依賴
#   - 建置專案
#
# 後續進階方案建議 (請參閱 README.md 或下方註解)：
#   1. 加入 ESLint/Prettier 進行程式碼風格檢查
#   2. 加入 Vitest 進行單元測試
#   3. 加入 Playwright/Cypress 進行 E2E 測試
#   4. 加入程式碼覆蓋率報告
#   5. 加入安全性掃描 (如 npm audit)
#   6. 加入 Docker 容器化部署
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - master
      - vibe
  pull_request:
    branches:
      - main
      - master
      - vibe

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # 使用預設的 base path 進行 CI 建置
          VITE_BASE_PATH: /

